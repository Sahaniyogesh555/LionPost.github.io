# Site settings
title: AlphaPost.io — The free creator-publishing platform
email:
description: >-
  AlphaPost.io is a free creator-publishing platform that combines AI-assisted
  content production, scheduled distribution, blogging automation, research
  utilities, and a creator community under one account. 16 tools. No
  subscription or card required.
repository: LionPost/LionPost.github.io
baseurl: "" # the subpath of your site, e.g. /blog/ (If you use organization leave empty)
url: "https://alphapost.io" # the base hostname & protocol for your site

google_analytics: ""

# Social networks usernames
social:
  - title: twitter
    url: https://twitter.com/AlphaPostApp
  - title: facebook
    url: https://facebook.com/AlphaPostApp
  - title: instagram
    url: https://instagram.com/AlphaPostApp

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title
paginate: 5
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

gems: [jekyll-paginate, jekyll-feed, jekyll-sitemap, jekyll-seo-tag]

# compress settings
compress_html:
  clippings: all
  comments: all
  endings: []
  ignore:
    envs: []
  blanklines: false
  profile: false
  startings: []

# SEO
twitter:
  username: AlphaPostApp

# Platform
platform_name: AlphaPost.io
platform_tagline: Free creator-publishing platform. 16 tools. No subscription. No card required.
